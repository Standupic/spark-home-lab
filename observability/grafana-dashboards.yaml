apiVersion: v1
data:
  dgx-spark-api-gateway.json: |-
    {
      "title": "DGX Spark - API Gateway",
      "uid": "dgx-spark-api-gateway",
      "panels": [
        {
          "id": 1,
          "title": "Request Rate by Service",
          "type": "timeseries",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 0
          },
          "targets": [
            {
              "expr": "sum by (service)(rate(traefik_service_requests_total{service=~\".*open-webui.*|.*litellm.*|.*headlamp.*|.*grafana.*\"}[5m]))",
              "legendFormat": "{{service}}"
            }
          ],
          "datasource": {
            "type": "prometheus",
            "uid": "PBFA97CFB590B2093"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "reqps"
            }
          }
        },
        {
          "id": 2,
          "title": "Status Codes",
          "type": "timeseries",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 8
          },
          "targets": [
            {
              "expr": "sum by (code)(rate(traefik_service_requests_total{service=~\".*open-webui.*|.*litellm.*|.*headlamp.*|.*grafana.*\"}[5m]))",
              "legendFormat": "{{code}}"
            }
          ],
          "datasource": {
            "type": "prometheus",
            "uid": "PBFA97CFB590B2093"
          },
          "fieldConfig": {
            "defaults": {}
          }
        },
        {
          "id": 3,
          "title": "Error Rate (5xx)",
          "type": "stat",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 16
          },
          "targets": [
            {
              "expr": "sum(rate(traefik_service_requests_total{service=~\".*open-webui.*|.*litellm.*|.*headlamp.*|.*grafana.*\",code=~\"5..\"}[5m]))"
            }
          ],
          "datasource": {
            "type": "prometheus",
            "uid": "PBFA97CFB590B2093"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "red",
                    "value": 0.1
                  }
                ]
              }
            }
          }
        },
        {
          "id": 4,
          "title": "P50/P95/P99 Latency",
          "type": "timeseries",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 24
          },
          "targets": [
            {
              "expr": "histogram_quantile(0.50, sum by (le)(rate(traefik_entrypoint_request_duration_seconds_bucket[5m])))",
              "legendFormat": "P50"
            },
            {
              "expr": "histogram_quantile(0.95, sum by (le)(rate(traefik_entrypoint_request_duration_seconds_bucket[5m])))",
              "legendFormat": "P95"
            },
            {
              "expr": "histogram_quantile(0.99, sum by (le)(rate(traefik_entrypoint_request_duration_seconds_bucket[5m])))",
              "legendFormat": "P99"
            }
          ],
          "datasource": {
            "type": "prometheus",
            "uid": "PBFA97CFB590B2093"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "s"
            }
          }
        },
        {
          "id": 5,
          "title": "Active Connections",
          "type": "timeseries",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 32
          },
          "targets": [
            {
              "expr": "traefik_open_connections",
              "legendFormat": "{{entrypoint}}/{{protocol}}"
            }
          ],
          "datasource": {
            "type": "prometheus",
            "uid": "PBFA97CFB590B2093"
          },
          "fieldConfig": {
            "defaults": {}
          }
        },
        {
          "id": 6,
          "title": "Config Reloads",
          "type": "stat",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 40
          },
          "targets": [
            {
              "expr": "changes(traefik_config_reloads_total{instance=~\".*traefik.*svc.*\"}[1h])",
              "legendFormat": "Reloads (1h)"
            }
          ],
          "datasource": {
            "type": "prometheus",
            "uid": "PBFA97CFB590B2093"
          },
          "fieldConfig": {
            "defaults": {
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "yellow",
                    "value": 3
                  },
                  {
                    "color": "red",
                    "value": 10
                  }
                ]
              }
            }
          }
        },
        {
          "id": 7,
          "title": "TLS Certificate Expiry",
          "type": "stat",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 48
          },
          "targets": [
            {
              "expr": "(traefik_tls_certs_not_after{instance=~\".*traefik.*svc.*\"} - time()) / 86400",
              "legendFormat": "Days until expiry"
            }
          ],
          "datasource": {
            "type": "prometheus",
            "uid": "PBFA97CFB590B2093"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "d",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "yellow",
                    "value": 30
                  },
                  {
                    "color": "green",
                    "value": 90
                  }
                ]
              }
            }
          }
        }
      ],
      "schemaVersion": 38,
      "tags": [
        "dgx",
        "spark"
      ],
      "time": {
        "from": "now-1h",
        "to": "now"
      },
      "refresh": "30s"
    }
  dgx-spark-inference.json: |-
    {
      "title": "DGX Spark - Inference",
      "uid": "dgx-spark-inference",
      "refresh": "10s",
      "schemaVersion": 39,
      "tags": [
        "inference",
        "llamacpp"
      ],
      "time": {
        "from": "now-15m",
        "to": "now"
      },
      "panels": [
        {
          "type": "timeseries",
          "title": "Generation Throughput (t/s)",
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 6,
            "h": 8
          },
          "targets": [
            {
              "refId": "A",
              "expr": "llamacpp:predicted_tokens_seconds{app=\"gemma\"}",
              "legendFormat": "Gemma 4 26B"
            },
            {
              "refId": "B",
              "expr": "llamacpp:predicted_tokens_seconds{app=\"qwen\"}",
              "legendFormat": "Qwen 3.6 35B"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "tokens/sec"
            }
          }
        },
        {
          "type": "timeseries",
          "title": "Prompt Throughput (t/s)",
          "gridPos": {
            "x": 6,
            "y": 0,
            "w": 6,
            "h": 8
          },
          "targets": [
            {
              "refId": "A",
              "expr": "llamacpp:prompt_tokens_seconds{app=\"gemma\"}",
              "legendFormat": "Gemma"
            },
            {
              "refId": "B",
              "expr": "llamacpp:prompt_tokens_seconds{app=\"qwen\"}",
              "legendFormat": "Qwen"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "tokens/sec"
            }
          }
        },
        {
          "type": "timeseries",
          "title": "Active Requests",
          "gridPos": {
            "x": 12,
            "y": 0,
            "w": 4,
            "h": 8
          },
          "targets": [
            {
              "refId": "A",
              "expr": "llamacpp:requests_processing{app=\"gemma\"}",
              "legendFormat": "Gemma active"
            },
            {
              "refId": "B",
              "expr": "llamacpp:requests_processing{app=\"qwen\"}",
              "legendFormat": "Qwen active"
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "Queue Depth",
          "gridPos": {
            "x": 16,
            "y": 0,
            "w": 4,
            "h": 8
          },
          "targets": [
            {
              "refId": "A",
              "expr": "llamacpp:requests_deferred{app=\"gemma\"}",
              "legendFormat": "Gemma queued"
            },
            {
              "refId": "B",
              "expr": "llamacpp:requests_deferred{app=\"qwen\"}",
              "legendFormat": "Qwen queued"
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "Decode Calls / 5m",
          "gridPos": {
            "x": 20,
            "y": 0,
            "w": 4,
            "h": 8
          },
          "targets": [
            {
              "refId": "A",
              "expr": "rate(llamacpp:n_decode_total{app=\"gemma\"}[5m])",
              "legendFormat": "Gemma"
            },
            {
              "refId": "B",
              "expr": "rate(llamacpp:n_decode_total{app=\"qwen\"}[5m])",
              "legendFormat": "Qwen"
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "Tokens Generated / 5m",
          "gridPos": {
            "x": 0,
            "y": 8,
            "w": 6,
            "h": 8
          },
          "targets": [
            {
              "refId": "A",
              "expr": "rate(llamacpp:tokens_predicted_total{app=\"gemma\"}[5m])",
              "legendFormat": "Gemma"
            },
            {
              "refId": "B",
              "expr": "rate(llamacpp:tokens_predicted_total{app=\"qwen\"}[5m])",
              "legendFormat": "Qwen"
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "Tokens Prompted / 5m",
          "gridPos": {
            "x": 6,
            "y": 8,
            "w": 6,
            "h": 8
          },
          "targets": [
            {
              "refId": "A",
              "expr": "rate(llamacpp:prompt_tokens_total{app=\"gemma\"}[5m])",
              "legendFormat": "Gemma"
            },
            {
              "refId": "B",
              "expr": "rate(llamacpp:prompt_tokens_total{app=\"qwen\"}[5m])",
              "legendFormat": "Qwen"
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "GPU Utilization %",
          "gridPos": {
            "x": 12,
            "y": 8,
            "w": 6,
            "h": 8
          },
          "targets": [
            {
              "refId": "A",
              "expr": "nvidia_gpu_utilization_percent",
              "legendFormat": "GPU {{gpu_uuid}}"
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "GPU Memory Used (GiB)",
          "gridPos": {
            "x": 18,
            "y": 8,
            "w": 6,
            "h": 8
          },
          "targets": [
            {
              "refId": "A",
              "expr": "nvidia_gpu_memory_used_bytes / 1073741824",
              "legendFormat": "GPU"
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "LiteLLM P50 Latency",
          "gridPos": {
            "x": 0,
            "y": 16,
            "w": 6,
            "h": 8
          },
          "targets": [
            {
              "refId": "A",
              "expr": "histogram_quantile(0.50, rate(traefik_service_request_duration_seconds_bucket{service=\"litellm-access-service@kubernetescrd\"}[5m])) * 1000",
              "legendFormat": "P50"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "ms"
            }
          }
        },
        {
          "type": "timeseries",
          "title": "LiteLLM P95 Latency",
          "gridPos": {
            "x": 6,
            "y": 16,
            "w": 6,
            "h": 8
          },
          "targets": [
            {
              "refId": "A",
              "expr": "histogram_quantile(0.95, rate(traefik_service_request_duration_seconds_bucket{service=\"litellm-access-service@kubernetescrd\"}[5m])) * 1000",
              "legendFormat": "P95"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "ms"
            }
          }
        },
        {
          "type": "timeseries",
          "title": "Qwen MTP Draft Efficiency",
          "gridPos": {
            "x": 12,
            "y": 16,
            "w": 6,
            "h": 8
          },
          "targets": [
            {
              "refId": "A",
              "expr": "(rate(llamacpp:draft_tokens_accepted_total{app=\"qwen\"}[5m]) / rate(llamacpp:draft_tokens_total{app=\"qwen\"}[5m])) * 100",
              "legendFormat": "% Accepted"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percent"
            }
          }
        },
        {
          "type": "timeseries",
          "title": "Largest Batch Size",
          "gridPos": {
            "x": 18,
            "y": 16,
            "w": 6,
            "h": 8
          },
          "targets": [
            {
              "refId": "A",
              "expr": "llamacpp:n_tokens_max{app=\"gemma\"}",
              "legendFormat": "Gemma max batch"
            },
            {
              "refId": "B",
              "expr": "llamacpp:n_tokens_max{app=\"qwen\"}",
              "legendFormat": "Qwen max batch"
            }
          ]
        }
      ]
    }
  dgx-spark-kubernetes.json: |-
    {
      "title": "DGX Spark - Kubernetes",
      "uid": "dgx-spark-kubernetes",
      "panels": [
        {
          "id": 1,
          "title": "K3s Version",
          "type": "stat",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 0
          },
          "targets": [
            {
              "expr": "kube_node_info",
              "format": "table",
              "instant": true
            }
          ],
          "datasource": {
            "type": "prometheus",
            "uid": "PBFA97CFB590B2093"
          },
          "fieldConfig": {
            "defaults": {
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              }
            }
          },
          "options": {
            "reduceOptions": {
              "values": false,
              "calcs": [
                "lastNotNull"
              ],
              "fields": "/^kubelet_version$/"
            },
            "textMode": "value",
            "colorMode": "value"
          }
        },
        {
          "id": 2,
          "title": "Node Capacity",
          "type": "stat",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 8
          },
          "targets": [
            {
              "expr": "kube_node_status_capacity{resource=\"memory\"}/1073741824",
              "legendFormat": "Memory GiB",
              "instant": true
            },
            {
              "expr": "kube_node_status_capacity{resource=\"cpu\"}",
              "legendFormat": "CPU Cores",
              "instant": true
            },
            {
              "expr": "kube_node_status_capacity{resource=\"nvidia_com_gpu\"}",
              "legendFormat": "GPU Replicas",
              "instant": true
            }
          ],
          "datasource": {
            "type": "prometheus",
            "uid": "PBFA97CFB590B2093"
          },
          "fieldConfig": {
            "defaults": {
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "blue",
                    "value": null
                  }
                ]
              }
            }
          },
          "options": {
            "reduceOptions": {
              "values": true,
              "calcs": [
                "lastNotNull"
              ]
            },
            "textMode": "value_and_name",
            "colorMode": "value"
          }
        },
        {
          "id": 3,
          "title": "Pods by Namespace",
          "type": "piechart",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 16
          },
          "targets": [
            {
              "expr": "count by (namespace)(kube_pod_info)",
              "legendFormat": "{{namespace}}"
            }
          ],
          "datasource": {
            "type": "prometheus",
            "uid": "PBFA97CFB590B2093"
          },
          "fieldConfig": {
            "defaults": {}
          },
          "options": {
            "displayLabels": [
              "percent"
            ],
            "legend": {
              "displayMode": "table",
              "placement": "right"
            }
          }
        },
        {
          "id": 4,
          "title": "Not Ready / Problem Pods",
          "type": "table",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 24
          },
          "targets": [
            {
              "expr": "kube_pod_status_ready{condition=\"false\"} == 1",
              "format": "table"
            }
          ],
          "datasource": {
            "type": "prometheus",
            "uid": "PBFA97CFB590B2093"
          },
          "fieldConfig": {
            "defaults": {
              "custom": {
                "minWidth": 150
              }
            }
          },
          "options": {
            "showHeader": true
          },
          "transformations": [
            {
              "id": "organize",
              "options": {
                "excludeByName": {
                  "Time": true,
                  "uid": true,
                  "__name__": true,
                  "instance": true,
                  "job": true,
                  "node": true,
                  "condition": false,
                  "pod": false,
                  "namespace": false
                }
              }
            }
          ]
        },
        {
          "id": 5,
          "title": "Container Restarts (last 5 min)",
          "type": "timeseries",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 32
          },
          "targets": [
            {
              "expr": "rate(kube_pod_container_status_restarts_total[5m]) > 0",
              "legendFormat": "{{namespace}}/{{pod}}"
            }
          ],
          "datasource": {
            "type": "prometheus",
            "uid": "PBFA97CFB590B2093"
          },
          "fieldConfig": {
            "defaults": {}
          }
        },
        {
          "id": 6,
          "title": "Deployments: Ready / Desired",
          "type": "timeseries",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 40
          },
          "targets": [
            {
              "expr": "kube_deployment_status_replicas_available",
              "legendFormat": "{{namespace}}/{{deployment}} - Ready"
            },
            {
              "expr": "kube_deployment_spec_replicas",
              "legendFormat": "{{namespace}}/{{deployment}} - Desired"
            }
          ],
          "datasource": {
            "type": "prometheus",
            "uid": "PBFA97CFB590B2093"
          },
          "fieldConfig": {
            "defaults": {}
          }
        },
        {
          "id": 7,
          "title": "PVC Usage",
          "type": "gauge",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 48
          },
          "targets": [
            {
              "expr": "kube_persistentvolumeclaim_resource_requests_storage_bytes / 1073741824",
              "legendFormat": "{{namespace}}/{{persistentvolumeclaim}}"
            }
          ],
          "datasource": {
            "type": "prometheus",
            "uid": "PBFA97CFB590B2093"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "decgbytes",
              "min": 0
            }
          },
          "options": {
            "reduceOptions": {
              "values": true,
              "calcs": [
                "lastNotNull"
              ]
            },
            "orientation": "horizontal"
          }
        }
      ],
      "schemaVersion": 38,
      "tags": [
        "dgx",
        "spark"
      ],
      "time": {
        "from": "now-1h",
        "to": "now"
      },
      "refresh": "30s"
    }
  dgx-spark-node.json: |-
    {
      "title": "DGX Spark - Node",
      "uid": "dgx-spark-node",
      "panels": [
        {
          "id": 1,
          "title": "CPU Usage %",
          "type": "timeseries",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 0
          },
          "targets": [
            {
              "expr": "100 - (avg by (instance)(rate(node_cpu_seconds_total{mode=\"idle\",instance=~\".*node-exporter.*\"}[1m])) * 100)"
            }
          ],
          "datasource": {
            "type": "prometheus",
            "uid": "PBFA97CFB590B2093"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "min": 0,
              "max": 100
            }
          }
        },
        {
          "id": 2,
          "title": "Memory Usage",
          "type": "gauge",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 8
          },
          "targets": [
            {
              "expr": "100 - (node_memory_MemAvailable_bytes{instance=~\".*node-exporter.*\"} / node_memory_MemTotal_bytes{instance=~\".*node-exporter.*\"} * 100)"
            }
          ],
          "datasource": {
            "type": "prometheus",
            "uid": "PBFA97CFB590B2093"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "min": 0,
              "max": 100
            }
          }
        },
        {
          "id": 3,
          "title": "Memory Available / Total",
          "type": "timeseries",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 16
          },
          "targets": [
            {
              "expr": "node_memory_MemTotal_bytes{instance=~\".*node-exporter.*\"} / 1073741824",
              "legendFormat": "Total GiB"
            },
            {
              "expr": "node_memory_MemAvailable_bytes{instance=~\".*node-exporter.*\"} / 1073741824",
              "legendFormat": "Available GiB"
            }
          ],
          "datasource": {
            "type": "prometheus",
            "uid": "PBFA97CFB590B2093"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "decgbytes"
            }
          }
        },
        {
          "id": 4,
          "title": "Disk Usage %",
          "type": "gauge",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 24
          },
          "targets": [
            {
              "expr": "100 - (node_filesystem_avail_bytes{mountpoint=\"/\",instance=~\".*node-exporter.*\"} / node_filesystem_size_bytes{mountpoint=\"/\",instance=~\".*node-exporter.*\"} * 100)"
            }
          ],
          "datasource": {
            "type": "prometheus",
            "uid": "PBFA97CFB590B2093"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "min": 0,
              "max": 100
            }
          }
        },
        {
          "id": 5,
          "title": "Disk Total / Free",
          "type": "timeseries",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 32
          },
          "targets": [
            {
              "expr": "node_filesystem_size_bytes{mountpoint=\"/\",instance=~\".*node-exporter.*\"} / 1073741824",
