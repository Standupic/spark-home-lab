  dgx-spark-open-webui.json: |-
    {
      "title": "DGX Spark - Open WebUI",
      "uid": "dgx-spark-open-webui",
      "panels": [
        {
          "id": 1,
          "title": "Request Rate",
          "type": "timeseries",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 0
          },
          "targets": [
            {
              "expr": "sum by (code)(rate(traefik_service_requests_total{service=~\".*open-webui.*\"}[5m]))",
              "legendFormat": "{{code}}"
            }
          ],
          "datasource": {
            "type": "prometheus",
            "uid": "PBFA97CFB590B2093"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "reqps"
            }
          }
        },
        {
          "id": 2,
          "title": "Latency",
          "type": "timeseries",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 8
          },
          "targets": [
            {
              "expr": "histogram_quantile(0.50, rate(traefik_entrypoint_request_duration_seconds_bucket[5m]))",
              "legendFormat": "P50"
            },
            {
              "expr": "histogram_quantile(0.95, rate(traefik_entrypoint_request_duration_seconds_bucket[5m]))",
              "legendFormat": "P95"
            }
          ],
          "datasource": {
            "type": "prometheus",
            "uid": "PBFA97CFB590B2093"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "s"
            }
          }
        },
        {
          "id": 3,
          "title": "HTTP Status Codes",
          "type": "timeseries",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 16
          },
          "targets": [
            {
              "expr": "sum by (code)(traefik_service_requests_total{service=~\".*open-webui.*\"})",
              "legendFormat": "{{code}}"
            }
          ],
          "datasource": {
            "type": "prometheus",
            "uid": "PBFA97CFB590B2093"
          },
          "fieldConfig": {
            "defaults": {}
          }
        },
        {
          "id": 4,
          "title": "Error Rate",
          "type": "stat",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 24
          },
          "targets": [
            {
              "expr": "sum(rate(traefik_service_requests_total{service=~\".*open-webui.*\",code=~\"5..\"}[5m]))"
            }
          ],
          "datasource": {
            "type": "prometheus",
            "uid": "PBFA97CFB590B2093"
          },
          "fieldConfig": {
            "defaults": {
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "red",
                    "value": 0.1
                  }
                ]
              }
            }
          }
        },
        {
          "id": 5,
          "title": "Backend Health (All Services)",
          "type": "table",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 32
          },
          "targets": [
            {
              "expr": "kube_pod_status_ready{namespace=~\"inference|access|platform|observability\"}",
              "format": "table"
            }
          ],
          "datasource": {
            "type": "prometheus",
            "uid": "PBFA97CFB590B2093"
          },
          "fieldConfig": {
            "defaults": {
              "custom": {
                "minWidth": 120
              }
            }
          },
          "transformations": [
            {
              "id": "organize",
              "options": {
                "excludeByName": {
                  "Time": true,
                  "uid": true,
                  "__name__": true,
                  "instance": true,
                  "job": true,
                  "node": true,
                  "condition": true
                }
              }
            },
            {
              "id": "renameByRegex",
              "options": {
                "regex": "kube_pod_status_ready",
                "rename": "Ready"
              }
            }
          ]
        },
        {
          "id": 6,
          "title": "Open WebUI SSE Connections",
          "type": "stat",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 40
          },
          "targets": [
            {
              "expr": "traefik_open_connections{entrypoint=\"websecure\"}"
            }
          ],
          "datasource": {
            "type": "prometheus",
            "uid": "PBFA97CFB590B2093"
          },
          "fieldConfig": {
            "defaults": {}
          }
        }
      ],
      "schemaVersion": 38,
      "tags": [
        "dgx",
        "spark"
      ],
      "time": {
        "from": "now-1h",
        "to": "now"
      },
      "refresh": "30s"
    }
