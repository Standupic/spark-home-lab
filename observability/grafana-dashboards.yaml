          ],
          "datasource": {
            "type": "prometheus",
            "uid": "PBFA97CFB590B2093"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "min": 0,
              "max": 100
            }
          }
        },
        {
          "id": 9,
          "title": "GPU Power Draw (W)",
          "type": "gauge",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 64
          },
          "targets": [
            {
              "expr": "nvidia_gpu_power_watts{job=\"nvidia-gpu\"}"
