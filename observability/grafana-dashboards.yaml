            },
            {
              "expr": "node_filesystem_avail_bytes{mountpoint=\"/\",instance=~\".*node-exporter.*\"} / 1073741824",
              "legendFormat": "Free GiB"
            }
          ],
          "datasource": {
            "type": "prometheus",
            "uid": "PBFA97CFB590B2093"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "decgbytes"
            }
          }
        },
        {
          "id": 6,
