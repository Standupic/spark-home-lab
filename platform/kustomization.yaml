apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: platform
resources:
  - open-webui.yaml
  - headlamp.yaml
  - postgres.yaml
  - forgejo.yaml
secretGenerator:
  - name: postgres-secret
    literals:
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=litellm-platform
      - POSTGRES_DB=litellm
