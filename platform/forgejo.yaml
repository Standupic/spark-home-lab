apiVersion: apps/v1
kind: Deployment
metadata:
  name: forgejo
  namespace: platform
  labels:
    app: forgejo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: forgejo
  template:
    metadata:
      labels:
        app: forgejo
    spec:
      containers:
        - name: forgejo
          image: codeberg.org/forgejo/forgejo:10
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
              protocol: TCP
            - containerPort: 2222
              protocol: TCP
          env:
            - name: FORGEJO__server__DOMAIN
              value: git.spark.homelab.lan
            - name: FORGEJO__server__ROOT_URL
              value: https://git.spark.homelab.lan
            - name: FORGEJO__server__SSH_DOMAIN
              value: git.spark.homelab.lan
            - name: FORGEJO__server__SSH_LISTEN_PORT
              value: "2222"
            - name: FORGEJO__server__OFFLINE_MODE
              value: "true"
            - name: FORGEJO__database__DB_TYPE
              value: sqlite3
            - name: FORGEJO__actions__ENABLED
              value: "true"
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "2"
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /
              port: 3000
              scheme: HTTP
            initialDelaySeconds: 10
            periodSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: forgejo-data
---
apiVersion: v1
kind: Service
metadata:
  name: forgejo
  namespace: platform
spec:
  type: NodePort
  selector:
    app: forgejo
  ports:
    - name: http
      port: 3000
      targetPort: 3000
      nodePort: 30393
    - name: ssh
      port: 2222
      targetPort: 2222
      nodePort: 30022
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: forgejo-data
  namespace: platform
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
  storageClassName: local-path
