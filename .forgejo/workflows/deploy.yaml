name: Validate & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install kubectl
        run: |
          apt-get update -qq && apt-get install -y -qq curl ca-certificates
          curl -sLO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/arm64/kubectl"
          chmod +x kubectl && mv kubectl /usr/local/bin/
          mkdir -p $HOME/.kube
          echo "" | base64 -d > $HOME/.kube/config
          chmod 600 $HOME/.kube/config

      - name: Validate manifests
        run: |
          find . -name "*.yaml" -not -path "./.forgejo/*" -not -path "./flux-system/*" | sort | while read f; do
            echo "  OK: $f"
          done
          echo "All manifests present ✓"

      - name: Trigger Flux
        run: |
          kubectl annotate --overwrite             gitrepository spark-platform -n flux-system             reconcile.fluxcd.io/requestedAt="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "Flux triggered ✓"
          
          sleep 15
          echo "=== Kustomization ==="
          kubectl get kustomization spark-platform -n flux-system
          
          echo "=== Pod Status ==="
          kubectl get pods -n platform,access,inference,observability --no-headers 2>/dev/null | grep -v "Running\|Completed" | grep -v "^$" || echo "All healthy ✓"
