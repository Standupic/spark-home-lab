apiVersion: traefik.io/v1alpha1
kind: TLSOption
metadata:
  name: default
  namespace: default
spec:
  minVersion: VersionTLS12
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: open-webui
  namespace: default
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`open-webui.spark.homelab.lan`)
      services:
        - name: open-webui
          namespace: platform
          port: 8080
  tls:
    secretName: spark-tls-secret
---
apiVersion: traefik.io/v1alpha1
