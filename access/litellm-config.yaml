apiVersion: v1
kind: ConfigMap
metadata:
  name: litellm-config
  namespace: access
data:
  config.yaml: |
    model_list:
      - model_name: gemma-4
        litellm_params:
          model: openai/gemma
          api_base: http://gemma.inference.svc.cluster.local:8080/v1
          api_key: not-needed
          max_tokens: 8192
      - model_name: qwen-3.6
        litellm_params:
          model: openai/qwen
          api_base: http://qwen.inference.svc.cluster.local:8081/v1
          api_key: not-needed
          max_tokens: 16384
    general_settings:
      master_key: sk-admin-spark-001
